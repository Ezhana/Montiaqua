# 本地开发的唯一编排声明处：服务、依赖顺序、端口、环境变量都写在这里。
#
# 约定（与 infra/README.md、docs/adr/0002-compose-orchestration.md 一致）：
#   - 本地层允许 build:，直接构建工作区当前代码；这是 infra/ 与 deploy/ 最明确的区别；
#   - 依赖顺序用 depends_on + healthcheck 表达，不靠脚本等待、不靠外部调度器；
#   - 端口直通到宿主机；环境变量从 infra/env/.env 注入，模板见 infra/env/.env.example；
#   - 一次性任务（代码生成、边界检查）用 profiles 声明，不常驻。
#
# 加第一个服务时，把下面注释里的示例改成真实服务即可；
# 根 justfile 的 up / logs / ps 等别名只是转发到本文件，不需要改。
name: montiaqua

services: {}

